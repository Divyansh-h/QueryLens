# render.yaml
#
# Note on Render Free Plan Limitations:
# 1. Ephemeral Disk: The free tier provides no persistent storage. Every time the instance
#    spins down or redeploys, PostgreSQL will lose its data. Our start.sh script handles
#    this gracefully by re-initializing and re-seeding the database in the background!
# 2. Memory Constraints: Free web services are limited to 512 MB of RAM. We limit SEED_SCALE
#    to prevent PostgreSQL from consuming too much memory during bulk inserts.
# 3. Sleeping: After 15 minutes of inactivity, Render will shut down the service.

services:
  - type: web
    name: querylens
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SEED_SCALE
        value: "100000"
