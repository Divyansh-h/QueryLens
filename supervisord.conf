[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:postgres]
command=su - postgres -c "/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fastapi]
command=/opt/querylens/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/opt/querylens
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
